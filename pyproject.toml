[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pensieve"
version = "0.1.0"
description = "Pensieve - To-Do enrichment and memory store with HUD kanban dashboard"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andy Herman" }]
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "azure-identity>=1.15.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pypdf>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
pensieve = "pensieve.cli:app"

[tool.setuptools]
packages = ["pensieve", "pensieve.sources", "pensieve.enrichment", "pensieve.store", "pensieve.api"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]
