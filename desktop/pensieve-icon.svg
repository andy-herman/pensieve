<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="70%">
      <stop offset="0" stop-color="#34447a"/>
      <stop offset="0.6" stop-color="#1a2244"/>
      <stop offset="1" stop-color="#0c1022"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6b3"/>
      <stop offset="1" stop-color="#7a7262"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d9c4"/>
      <stop offset="1" stop-color="#9a917f"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9e8f8"/>
      <stop offset="1" stop-color="#8eaad0"/>
    </radialGradient>
    <linearGradient id="wisp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f2f7ff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#cfe0f7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#cfe0f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="236" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#c9a655" stroke-width="18"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f5d77b" stroke-opacity="0.35" stroke-width="3"/>

  <!-- stars -->
  <g fill="#f5d77b">
    <circle cx="140" cy="130" r="5"/>
    <circle cx="380" cy="118" r="4"/>
    <circle cx="402" cy="196" r="3"/>
    <circle cx="112" cy="206" r="3"/>
  </g>

  <!-- memory wisp rising from the pool -->
  <path d="M256 262 C 214 214, 304 190, 262 140 C 236 110, 286 88, 304 70"
        fill="none" stroke="url(#wisp)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>

  <!-- pedestal and base -->
  <path d="M222 372 L 290 372 L 306 424 L 206 424 Z" fill="url(#stone)" stroke="#3a342b" stroke-width="7" stroke-linejoin="round"/>
  <rect x="170" y="418" width="172" height="30" rx="10" fill="url(#stone)" stroke="#3a342b" stroke-width="7"/>

  <!-- bowl -->
  <path d="M112 266 Q 256 306 400 266 Q 388 366 300 380 L 212 380 Q 124 366 112 266 Z"
        fill="url(#stone)" stroke="#3a342b" stroke-width="7" stroke-linejoin="round"/>
  <!-- runes -->
  <g fill="none" stroke="#c9a655" stroke-width="6" stroke-linecap="round">
    <path d="M188 344 v -28 M 188 328 l -10 -12 M 188 328 l 10 -12"/>
    <path d="M256 314 l 11 15 l -11 15 l -11 -15 Z"/>
    <path d="M330 314 l -12 15 h 12 l -12 15"/>
  </g>

  <!-- rim and silver pool -->
  <ellipse cx="256" cy="266" rx="146" ry="40" fill="url(#rim)" stroke="#3a342b" stroke-width="7"/>
  <ellipse cx="256" cy="266" rx="120" ry="27" fill="url(#pool)" filter="url(#glow)"/>
  <path d="M184 266 C 206 248, 296 248, 306 264 C 314 278, 252 284, 238 270 C 230 262, 264 256, 276 266"
        fill="none" stroke="#5f7ea8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
</svg>
